name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: gd, exif, intl, pdo_sqlite, sodium, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # npm 10 fails on the starter kit's "overrides" (edgesOut bug)
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Setup Application
        run: composer setup

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run CI Checks
        run: composer ci:check

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build demo image
        run: docker compose build

      - name: Smoke test
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8090/up && break
            sleep 2
          done
          curl -fsS http://localhost:8090/play/K7M2QX > /dev/null
          docker compose ps
        env:
          COMPOSE_PROGRESS: plain

      - name: Logs on failure
        if: failure()
        run: docker compose logs
